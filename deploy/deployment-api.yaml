# api: HTTP API + demo UI. Stateless; reads public.* and scoring.*, owns
# api.* (brief cache). Picks up new scoring runs within a minute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmbs-api
spec:
  replicas: 2
  selector: { matchLabels: { app: cmbs-api } }
  template:
    metadata: { labels: { app: cmbs-api } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: ghcr.io/jay/cmbs-radar:latest
          command: ["cmbs-api", "--addr", ":8080"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cmbs-radar-db, key: url } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: cmbs-radar-anthropic, key: api-key, optional: true } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 30 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 2Gi }   # snapshot + two cached scenario universes
---
apiVersion: v1
kind: Service
metadata:
  name: cmbs-api
spec:
  selector: { app: cmbs-api }
  ports: [{ port: 80, targetPort: 8080 }]
