<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMBS Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>CMBS Radar</h1>
      <p class="sub">Refinance opportunities in public CMBS loan data, routed to the team that can act</p>
    </div>
  </div>
  <div class="meta" id="meta"></div>
  <button class="preset" id="preset" title="Office loans in the NYC metro maturing within 18 months with a refi gap">Demo: NYC office, 18 mo, gap</button>
</header>

<section class="strip">
  <div class="kpis" id="kpis"></div>
  <figure class="wall">
    <figcaption>Maturity wall: whole-loan balance by refi quarter</figcaption>
    <div id="wall"></div>
  </figure>
</section>

<section class="filters" aria-label="Filters">
  <label>Metro <select id="f-metro"><option value="">All</option></select></label>
  <label>Property <select id="f-type"><option value="">All</option></select></label>
  <label>Refi within <select id="f-months">
    <option value="">Any time</option><option value="6">6 months</option><option value="12">12 months</option>
    <option value="18">18 months</option><option value="24">24 months</option><option value="36">36 months</option>
  </select></label>
  <label class="grow">Search <input id="f-q" type="search" placeholder="Property, city or trust"></label>
  <label>Sort <select id="f-sort">
    <option value="gap">Largest gap ($)</option><option value="gap_pct">Largest gap (%)</option>
    <option value="maturity">Soonest refi</option><option value="balance">Largest loan</option>
  </select></label>
  <button id="f-reset" class="link">Reset</button>
</section>

<section class="scenario" aria-label="Rate scenario">
  <span>What if rates move</span>
  <select id="s-bps">
    <option value="-100">−100bp</option><option value="-50" selected>−50bp</option><option value="-25">−25bp</option>
    <option value="25">+25bp</option><option value="50">+50bp</option><option value="100">+100bp</option>
  </select>
  <button id="s-run">Re-score</button>
  <button id="s-clear" class="link" hidden>Clear scenario</button>
  <div id="s-out" class="s-out"></div>
</section>

<main class="work">
  <div id="map" class="map" role="img" aria-label="Map of opportunities by metro"></div>
  <div class="table-wrap">
    <div class="table-head"><span id="count"></span></div>
    <table>
      <thead><tr>
        <th>Property</th><th>Class</th><th class="num">Refi</th><th class="num">Whole loan</th>
        <th class="num">Gap</th><th class="num">DSCR</th><th class="num">DY</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<section class="bt" aria-label="Backtest">
  <h2>Backtest: did the score see it coming?</h2>
  <div id="backtest" class="muted">Loading…</div>
</section>

<aside id="drawer" class="drawer" hidden aria-label="Opportunity detail">
  <button class="close" id="close" aria-label="Close">×</button>
  <div id="detail"></div>
</aside>

<footer class="foot" id="limits"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
